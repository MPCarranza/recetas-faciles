<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gracias por tu compra</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f7f7f7;
      }
      .card {
        max-width: 680px;
        padding: 32px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0;
        color: #333;
      }
      .note {
        margin-top: 16px;
        color: #666;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>¡Gracias por tu compra!</h1>
      <p>
        Hemos recibido tu pago correctamente. En breve te llegará el recetario a
        tu correo electrónico.
      </p>
      <p class="note">
        Si no ves el correo en tu bandeja de entrada, revisá la carpeta de spam
        o promociones.
      </p>
      <p class="note">Si tenés problemas, escribinos a soporte.</p>
    </div>
  </body>
</html>
